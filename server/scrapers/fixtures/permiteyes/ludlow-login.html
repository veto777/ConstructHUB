function pageRedirect() 
    {
        window.location.replace("forgotemailsent.php");
    }  

//Privacy policy

  $("#privacypolicy").on("click",function(){
         window.open('https://www.fullcircletech.com/privacypolicy','_blank');
     });

    
     $('#Submit_Forgotpwd').click(function()
     {
        var LoginId=$('#ForgotUsername').val();
        
            $.ajax({
            url: 'controller/userregistration_controller.php',
            type: 'POST',
            data: {
                      action: "ForgotPwd",
                      LoginId: LoginId
                  },
            success: function(response1) {

               response2=response1.substr(-7);
               response=response1.trim();
              if (response2=="success"){
                 pageRedirect();

              }
              else{
                 $('#Errormsg').html(response);
              }

             
            }

        });


     });
	 
});

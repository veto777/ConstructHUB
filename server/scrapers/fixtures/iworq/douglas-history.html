    <script>
        function onCaptchaRedirect(token) {
            const btn = document.querySelector('button[data-callback="onCaptchaRedirect"]');
            var url = '{https://douglascounty.portal.iworq.net}'; //disable HTML-encoding
            if (btn && btn.dataset.href) {
                url = btn.dataset.href;
            }
            if ((new RegExp('g-recaptcha-response')).test(url)) {
                var splitArr = url.split("g-recaptcha-response", 2)[0].split("{", 2);
                var redirectUrl = splitArr[1] + "g-recaptcha-response=" + token;

                if (url.includes("page")) {
                    redirectUrl = redirectUrl + '&page' + url.split('page')[1].split("}", 2)[0];
                }
                window.location.href = redirectUrl;
            } else {
                var splitArr = url.split("{", 2)[1].split("}", 2);
                window.location.href = splitArr[0];
            }
        }

            <script>
            function checkDate(input) {
                                    const test = input.value;
                    const day = new Date(test).getUTCDay();
                    if ([6, 0].includes(day)) {
                        input.value = '';
                        alert('Weekends are not available dates for inspections.');
                    }
                            }

            const inspectionUnavailableDates = [];

            function checkDateAvailability(input) {
                const test = input.value;
                let dateAccepted = true;
                for (const date of inspectionUnavailableDates) {
                    if (date === test) {
                        input.style.backgroundColor = 'red';
                        alert('This date has been marked as unavailable. Please select a different date for your inspection request.');
                        dateAccepted = false;
                        break;
                    }
                }
                if (dateAccepted) {
                    input.style.backgroundColor = 'white';
                }
            }

<script>
document.addEventListener("DOMContentLoaded", (event) => {
  const body = document.querySelector('body');
  const siteNav = document.querySelector('#site-nav');

  const setMarginTop = (el, height) => {
    const marginTop = height + 16;
    el.style.marginTop = `${marginTop}px`;
  };

  setMarginTop(body, siteNav.offsetHeight);

  window.onresize = e => {
    setMarginTop(body, siteNav.offsetHeight);
  };

    document.querySelectorAll('.columns .row .col.has-toggle').forEach(function (col) {
        const value = col.querySelector('.field-value');
        const btn = col.querySelector('.field-toggle');
        if (!value || !btn) return;

        if (value.scrollHeight > value.clientHeight + 1) {
            btn.classList.remove('d-none');
        }

        btn.addEventListener('click', function () {
            const expanded = col.classList.toggle('is-expanded');
            btn.textContent = expanded ? 'Show less' : 'Show more';
            btn.setAttribute('aria-expanded', expanded);
        });
    });
});
</script>

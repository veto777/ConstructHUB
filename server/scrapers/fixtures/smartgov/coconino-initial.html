    <script>
        var ApplicationSearch =
        {
            initiateSearch: function () {
                var value = $('#query').val();

                value = ApplicationSearchHelper.sanitizeSearchText(value);

                // TO DO: Move this check into helper js file
                if (value.length >= 2) {
                    $('#query').val(value);
                    $('#Search').prop('disabled', true);
                    FormSupport.submitAction('Search');
                }
            },

            searchKeyHandler(event) {
                if (event.key === 'Enter') {
                    event.stopPropagation();
                    event.preventDefault();
                    var searchButton = document.getElementById('Search');
                    if (searchButton) {
                        searchButton.click();
                    }
                }
            }
        };
    </script>

name: iOS release (TestFlight)

# Builds, signs and uploads both iPhone apps (ConstructHUB, ConstructHUB CRM) to App Store Connect / TestFlight.
# Signing: the Construct Hub LLC App Store Connect key is NOT a repo secret — the job proves itself to
# https://constructhub.us/api/ci/ios-signing with GitHub's OIDC token (server/ci-signing.ts only answers this file on
# main or an ios-v* tag), uses Xcode's automatic signing with that key, and deletes it at the end.
# Result: ios-results branch, ios-release/<sha>.md (the tower has no GitHub token to read Actions logs).

on:
  workflow_dispatch:
  push:
    tags: ["ios-v*"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select newest Xcode 26
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, re, subprocess, sys
          candidates = glob.glob('/Applications/Xcode_26*.app')
          if not candidates:
              sys.exit('ERROR: No Xcode 26 installation found on this macos-15 runner.')
          selected = max(candidates, key=lambda p: tuple(map(int, re.findall(r'\d+', p))))
          subprocess.run(['sudo', 'xcode-select', '-s', selected + '/Contents/Developer'], check=True)
          subprocess.run(['xcodebuild', '-version'], check=True)
          PY

      - name: Install XcodeGen and generate the project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Get the signing key (GitHub OIDC → constructhub.us)
        id: key
        shell: bash
        run: |
          set -euo pipefail
          OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=constructhub-ios-signing" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$OIDC"
          RESP=$(curl -sS --fail -H "Authorization: Bearer $OIDC" https://constructhub.us/api/ci/ios-signing)
          KEY_ID=$(echo "$RESP" | python3 -c 'import json,sys; print(json.load(sys.stdin)["keyId"])')
          ISSUER=$(echo "$RESP" | python3 -c 'import json,sys; print(json.load(sys.stdin)["issuerId"])')
          TEAM=$(echo "$RESP" | python3 -c 'import json,sys; print(json.load(sys.stdin)["teamId"])')
          echo "::add-mask::$ISSUER"
          mkdir -p "$RUNNER_TEMP/keys" && chmod 700 "$RUNNER_TEMP/keys"
          KEY_PATH="$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          echo "$RESP" | python3 -c 'import json,sys,base64; sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["p8"]))' > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          unset RESP
          { echo "key_id=$KEY_ID"; echo "issuer=$ISSUER"; echo "team=$TEAM"; echo "key_path=$KEY_PATH"; } >> "$GITHUB_OUTPUT"

      - name: Archive, sign and upload both apps
        id: build
        shell: bash
        env:
          KEY_ID: ${{ steps.key.outputs.key_id }}
          ISSUER: ${{ steps.key.outputs.issuer }}
          TEAM: ${{ steps.key.outputs.team }}
          KEY_PATH: ${{ steps.key.outputs.key_path }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          status=0
          for scheme in "ConstructHUB" "ConstructHUB CRM"; do
            slug=$(echo "$scheme" | tr ' ' '-')
            log="$RUNNER_TEMP/out/$slug.log"
            archive="$RUNNER_TEMP/out/$slug.xcarchive"
            echo "== $scheme: archive" | tee "$log"
            if xcodebuild -project ios/ConstructHUB.xcodeproj -scheme "$scheme" -configuration Release \
                 -destination 'generic/platform=iOS' -archivePath "$archive" \
                 DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Distribution" \
                 CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
                 "${AUTH[@]}" archive >> "$log" 2>&1 \
               && echo "== $scheme: export + upload" >> "$log" \
               && xcodebuild -exportArchive -archivePath "$archive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
                    -exportPath "$RUNNER_TEMP/out/$slug-export" "${AUTH[@]}" >> "$log" 2>&1; then
              echo "$scheme: UPLOADED (build ${GITHUB_RUN_NUMBER})" >> "$RUNNER_TEMP/out/summary.txt"
            else
              echo "$scheme: FAILED" >> "$RUNNER_TEMP/out/summary.txt"; status=1
            fi
          done
          exit $status

      - name: Remove the signing key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - name: Write and commit the result to ios-results
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/ios-release.md"
          {
            echo "# iOS release — ${GITHUB_SHA:0:12} (run ${GITHUB_RUN_NUMBER}, ${GITHUB_REF})"
            echo
            cat "$RUNNER_TEMP/out/summary.txt" 2>/dev/null || echo "(no build summary — an earlier step failed)"
            for f in "$RUNNER_TEMP"/out/*.log; do
              [ -f "$f" ] || continue
              echo; echo "## $(basename "$f")"; echo '```'
              grep -E "error:|warning: .*(sign|provision)|No (profiles|signing)|Upload|EXPORT|ARCHIVE|BUILD|exportArchive|ITMS-|status code" "$f" | grep -v "$RUNNER_TEMP/keys" | tail -60
              echo '```'
            done
          } > "$report"
          tree=$(mktemp -d); rmdir "$tree"
          git worktree add --detach "$tree" HEAD
          git -C "$tree" switch --orphan "ios-results-rel-${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4 5; do
            if git ls-remote --exit-code --heads origin ios-results > /dev/null; then
              git fetch origin refs/heads/ios-results:refs/remotes/origin/ios-results
              git -C "$tree" reset --hard refs/remotes/origin/ios-results
            fi
            mkdir -p "$tree/ios-release" && cp "$report" "$tree/ios-release/${GITHUB_SHA:0:12}-run${GITHUB_RUN_NUMBER}.md"
            git -C "$tree" add ios-release
            git -C "$tree" diff --cached --quiet || git -C "$tree" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "ci(ios): release result ${GITHUB_SHA:0:12} run ${GITHUB_RUN_NUMBER}"
            git -C "$tree" push origin HEAD:refs/heads/ios-results && break
            sleep "$attempt"
          done
          git worktree remove --force "$tree"
